# One build for everyone: pushing a tag vX.Y.Z builds the agent image for amd64 + arm64 and pushes it to GHCR.
# Docker users pull ghcr.io/achirus-code/dipagent:latest, the Home Assistant add-on pulls the :X.Y.Z tag that
# homeassistant/dipagent/config.yaml names (kept in sync by scripts/sync-addon.py).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and push agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the agent version and the add-on
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^VERSION = "(.+)"$/\1/p' agent/app/main.py)
          if [ "$tag" != "$version" ]; then echo "tag $tag does not match VERSION $version in agent/app/main.py"; exit 1; fi
          python3 scripts/sync-addon.py --check
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r agent/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: agent

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          # no attestation manifests: they show up as unknown/unknown platforms in the registry
          provenance: false
          sbom: false
          build-args: BUILD_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/achirus-code/dipagent:${{ env.VERSION }}
            ghcr.io/achirus-code/dipagent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
