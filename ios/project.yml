# XcodeGen spec of the iPhone app – `xcodegen` (in this folder) regenerates DipAgent.xcodeproj.
# The sources folder is synchronized: new Swift files need no regeneration.
name: DipAgent
options:
  bundleIdPrefix: de.achirus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  DipAgentKit:
    path: ../shared/DipAgentKit
targets:
  DipAgent:
    type: application
    platform: iOS
    sources:
      - path: DipAgent
        type: syncedFolder
      - path: ../shared/Localization
        name: Localization
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: DipAgentKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DipAgent
        CFBundleShortVersionString: "1.17.1"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.achirus.DipAgent.refresh]
        NSLocalNetworkUsageDescription: DipAgent connects to your DipAgent agent on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.achirus.DipAgent.ios
        PRODUCT_NAME: DipAgent
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
